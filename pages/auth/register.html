<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/index.cssß">
    <link rel="stylesheet" href="../../styles/auth/register.css" />
    <title>Register</title>
  </head>

  <body>
    <div class="register-page">
      <div class="left">
        <div class="banner-header">
          <div class="logo-container">
            <img src="../../assets/kipkabus-logo.png" alt="logo" />
          </div>
          <h3>Mess Yetu</h3>
        </div>
        <div class="middle-header-text">
          <h1>Skip the queue. <br> Pay from your phone.</h1>
            <p>Order, pay with M-PESA, show your code.</p>
          
        </div>
        <div class="bottom-text">
          <p>Student cafeteria</p>
        </div>
      </div>
      <div class="right">
        <form action="" class="registration-form">
          <h2>Sign Up</h2>
          <label for="full-name" class="register-label">
            Full Name:
            <input type="text" id="full-name" />
          </label>
          <label for="phone-number" class="register-label">
            Phone Number:
            <input type="text" id="phone-number" />
          </label>
          <label for="password" class="register-label">
            Password:
            <input type="password" id="password" />
          </label>
          <button>Sign In</button>
          <a href="login.html">Already registered? Sign In</a>
        </form>
      </div>
    </div>
  </body>
</html>
