<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>

  <body>
    <div class="left">
      <div class="banner-header">
        <img src="" alt="logo" />
        <h3>Mess Yetu</h3>
      </div>
      <div class="middle-header-text">
        <h1>Order, pay with M-PESA, show your code.</h1>
        <p>Skip the queue. Pay from your phone.</p>
      </div>
      <div class="bottom-text">
        <p>Student cafeteria</p>
      </div>
    </div>
    <div class="right">
        <h2>Sign In</h2>
        <label for="phone-number" class="register-label">
            Phone Number:
            <input type="text" id="phone-number">
        </label>
        <label for="password" class="register-label">
            Password:
            <input type="password" id="password">
        </label>
        <button>Sign In</button>
        <a href="register.html">New Here? Create Account</a>
    </div>
  </body>
</html>
